name: Deploy to Hostinger

# Builds the Vite app once and uploads the same build to the three Hostinger
# subdomain folders. The app picks the portal from the hostname:
#   studio.aurezotech.com      -> client portal
#   studioadmin.aurezotech.com -> admin portal
#   widget.aurezotech.com      -> public widgets / embeds
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # Optional: set as a repository *variable* (not secret) if needed.
          VITE_SKIP_CLIENT_LOGIN_OTP: ${{ vars.VITE_SKIP_CLIENT_LOGIN_OTP }}

      - name: Prepare per-subdomain folders
        run: |
          for site in studio studioadmin widget; do
            rm -rf "out/$site" && mkdir -p "out/$site"
            cp -R dist/. "out/$site/"
          done
          cp deploy/hostinger/htaccess-portal out/studio/.htaccess
          cp deploy/hostinger/htaccess-portal out/studioadmin/.htaccess
          cp deploy/hostinger/htaccess-widget out/widget/.htaccess

      # FTP account root is public_html, so these paths are relative to it.
      - name: Upload studio.aurezotech.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/studio/
          server-dir: studio/

      - name: Upload studioadmin.aurezotech.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/studioadmin/
          server-dir: studioadmin/

      - name: Upload widget.aurezotech.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/widget/
          server-dir: widget/
